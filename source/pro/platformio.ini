[platformio]
default_envs = small16
src_dir = I-BT-Radio/src
data_dir = I-BT-Radio/data
include_dir = I-BT-Radio
build_dir = C:/esp32/SYSTEM/BUILD_OUTPUT
core_dir = C:/esp32/SYSTEM/TOOLS/platformio/core
packages_dir = C:/esp32/SYSTEM/TOOLS/platformio/packages
platforms_dir = C:/esp32/SYSTEM/TOOLS/platformio/platforms
build_cache_dir = C:/esp32/SYSTEM/BUILD_CACHE

[env]
platform = file://C:/esp32/SYSTEM/TOOLING/PLATFORM_LOCAL
framework = arduino, espidf
; Keep PlatformIO core and platform on the same SCons build to avoid
; replacing the imported package during the firmware link step.
platform_packages =
    tool-scons@https://github.com/pioarduino/scons/releases/download/4.11.1/scons-local-4.11.1.tar.gz
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -D YO_DUAL=1
    -D CORE_DEBUG_LEVEL=1
    -I I-BT-Radio
lib_deps =
    https://github.com/bitbank2/JPEGDEC.git#430cf789ec96a28fd65c38f0cc3818ab4728fe57
lib_ldf_mode = deep


[env:small]
board = esp32dev
board_build.partitions = partitions/small.csv
board_build.filesystem = spiffs
build_flags =
    ${env.build_flags}
    -D BOARD_CYD28=1
    -D BOARD_HAS_PSRAM=1

lib_ignore =
    Adafruit seesaw Library
lib_deps =
    ${env.lib_deps}
    SD=file://C:/esp32/SYSTEM/TOOLS/platformio/packages/framework-arduinoespressif32/libraries/SD
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.1

custom_component_remove =
    espressif/esp-modbus
    espressif/esp_modem
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp-sr

[env:small16]
extends = env:small
board_upload.flash_size = 16MB
board_build.partitions = partitions/small16.csv
extra_scripts = pre:scripts/ensure_small16_sdkconfig.py
    pre:scripts/ensure_sbc_rate.py
    post:scripts/sbc_probe_link.py
    post:scripts/extra_codec_link.py
build_flags =
    ${env:small.build_flags}
    -D FEATURE_SD=1
    -D FEATURE_BARE_TOUCH_WIFI=0






; Development only. Not an upload package and not the default SMALL target.
[env:small16_ble]
extends = env:small16
build_flags =
    ${env:small16.build_flags}
    -D IBT_SENSOR_EXPERIMENTAL=1

; Separate compatibility target. Keep the existing rev3 binary/profile intact.
[env:small16_ble_rev1]
extends = env:small16_ble

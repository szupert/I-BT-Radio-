[platformio]
default_envs = lite16
src_dir = yoRadio/src
include_dir = yoRadio
data_dir = data_lite
build_dir = C:/esp32/SYSTEM/BUILD_OUTPUT_LITE
core_dir = C:/esp32/SYSTEM/TOOLS/platformio/core
packages_dir = C:/esp32/SYSTEM/TOOLS/platformio/packages
platforms_dir = C:/esp32/SYSTEM/TOOLS/platformio/platforms
[env]
platform = file://C:/esp32/SYSTEM/TOOLING/PLATFORM_LOCAL
framework = arduino, espidf
board = esp32dev
platform_packages = tool-scons@https://github.com/pioarduino/scons/releases/download/4.11.1/scons-local-4.11.1.tar.gz
board_build.filesystem = spiffs
extra_scripts = pre:scripts/lite_geometry.py
build_flags = -D YO_DUAL=1 -D BOARD_CYD28=1 -D IBT_LITE=1 -D IBT_NO_PSRAM=1 -D FEATURE_SD=1 -D FEATURE_BARE_TOUCH_WIFI=0 -D FEATURE_BT_A2DP_SMALL=1 -D FEATURE_ENCODER=1 -D CORE_DEBUG_LEVEL=1 -I yoRadio
lib_deps =
    https://github.com/bitbank2/JPEGDEC.git#430cf789ec96a28fd65c38f0cc3818ab4728fe57
    SD=file://C:/esp32/SYSTEM/TOOLS/platformio/packages/framework-arduinoespressif32/libraries/SD
    adafruit/Adafruit ST7735 and ST7789 Library@1.11.0
    adafruit/Adafruit GFX Library@1.11.11
    adafruit/Adafruit BusIO@1.16.1
lib_ignore = Adafruit seesaw Library
lib_ldf_mode = deep
custom_component_remove =
    espressif/esp-modbus
    espressif/esp_modem
    espressif/esp_hosted
    espressif/esp_wifi_remote
    espressif/esp_rainmaker
    espressif/rmaker_common
    espressif/esp_insights
    espressif/esp_diag_data_store
    espressif/esp_diagnostics
    espressif/esp-sr

[env:lite16]
lib_ignore = ${env.lib_ignore}
    ArduinoOTA
    ESPmDNS
board_upload.flash_size = 16MB
board_build.partitions = partitions/small16.csv
[env:lite4]
build_flags = ${env.build_flags} -D IBT_LIGHT4_DNS_AUTO=1 -D IBT_STREAM_ART_DIAG=1
lib_ignore = ${env.lib_ignore}
    ArduinoOTA
    ESPmDNS
board_upload.flash_size = 4MB
board_build.partitions = partitions/lite4.csv

[env:psram16]
extends = env:lite16
lib_ignore = ${env.lib_ignore}
build_flags = -D YO_DUAL=1 -D BOARD_CYD28=1 -D IBT_LITE=1 -D IBT_NO_PSRAM=0 -D FEATURE_SD=1 -D FEATURE_BARE_TOUCH_WIFI=0 -D FEATURE_BT_A2DP_SMALL=1 -D FEATURE_ENCODER=1 -D CORE_DEBUG_LEVEL=1 -I yoRadio
[env:psram4]
extends = env:psram16
build_flags = ${env:psram16.build_flags} -D IBT_COMPACT_UI=1
board_upload.flash_size = 4MB
board_build.partitions = partitions/lite4.csv
